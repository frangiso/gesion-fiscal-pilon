// CLIENT ALERTS
function ClientAlerts(props){
  var user=props.user;
  var cat=user.fiscal?user.fiscal.cat:'A';
  var invs=STORE.inv[user.id]||[];
  var pays=STORE.pay[user.id]||[];
  var mes=new Date().getMonth()+1;
  var total=invs.reduce(function(s,f){return s+f.monto;},0);
  var pct=getPct(total,cat);
  var rest=getRest(total,cat);
  var catC=getCat(total);
  var vends=pays.filter(function(p){return p.estado==='vencido';});
  var pends=pays.filter(function(p){return p.estado==='pendiente';});
  var alerts=[];
  if(pct>=90)alerts.push({tipo:'danger',t:'Limite de categoria casi alcanzado',d:'Facturaste el '+pct+'% del limite de la Categoria '+cat+'. Te quedan '+fmt(rest)+'. Consulta con Franco urgente.'});
  else if(pct>=70)alerts.push({tipo:'warn',t:'Acercandote al limite',d:'Facturaste '+pct+'% del limite de tu categoria. Te quedan '+fmt(rest)+'.'});
  if(total>0&&catC!==cat)alerts.push({tipo:'warn',t:'Revision de categoria',d:'Segun tu facturacion ('+fmt(total)+'), deberias estar en Categoria '+catC+'. Habla con Franco.'});
  if(vends.length>0)alerts.push({tipo:'danger',t:vends.length+' pago'+(vends.length>1?'s':'')+' vencido'+(vends.length>1?'s':''),d:'Tenes pagos sin abonar con fecha vencida. Regulariza para evitar multas.'});
  if(pends.length>0)alerts.push({tipo:'info',t:pends.length+' pago'+(pends.length>1?'s':'')+' proximo'+(pends.length>1?'s':''),d:'El monotributo vence el dia 20 de cada mes.'});
  if(mes===1||mes===7)alerts.push({tipo:'info',t:'Periodo de recategorizacion',d:'Estamos en periodo de recategorizacion. Tu contador revisara si corresponde cambiar tu categoria.'});
  if(alerts.length===0)alerts.push({tipo:'success',t:'Todo en orden',d:'No tenes alertas pendientes. Tus pagos estan al dia y tu facturacion esta dentro del limite.'});
  return h('div',{className:'page'},
    h('div',{className:'sec-title',style:{marginBottom:16}},'Alertas y Avisos'),
    h('div',{style:{display:'flex',flexDirection:'column',gap:10}},alerts.map(function(a,i){return h('div',{key:i,className:'alert-box alert-'+a.tipo,style:{padding:'14px 16px'}},h('div',null,h('div',{style:{fontWeight:700,marginBottom:3}},a.t),h('div',{style:{fontSize:12.5,opacity:.9}},a.d)));})),
    h('div',{className:'card',style:{marginTop:18}},h('div',{className:'card-hd'},h('span',{className:'card-title'},'Fechas clave')),h('div',{className:'card-bd',style:{paddingTop:10}},
      [{dia:'Dia 20 de cada mes',desc:'Vencimiento Monotributo',col:'#1B4FD8'},{dia:'Dia 15 de cada mes',desc:'Vencimiento IIBB',col:'#0A6E3E'},{dia:'Enero y Julio',desc:'Recategorizacion (del 1 al 20)',col:'#C45A0A'},{dia:'Diciembre',desc:'Revisar proyeccion anual',col:'#B8860B'}].map(function(f,i){return h('div',{key:i,style:{display:'flex',alignItems:'center',gap:12,padding:'9px 0',borderBottom:i<3?'1px solid #ECEEF4':'none'}},h('div',{style:{width:9,height:9,borderRadius:'50%',background:f.col,flexShrink:0}}),h('div',{style:{fontWeight:700,fontSize:12.5,minWidth:155}},f.dia),h('div',{style:{fontSize:12.5,color:'#4A5568'}},f.desc));})

var PAGE_TITLES={
  adash:'Dashboard',aclients:'Clientes',abillin:'Facturacion',aiibb:'IIBB / DJ',
  apay:'Gestion de Pagos',cal:'Calendario Fiscal',amsgs:'Mensajes',
  cdash:'Mi Panel',cbill:'Mi Facturacion',ciibb:'IIBB / DJ',cpay:'Mis Pagos',calerts:'Alertas',cmsgs:'Mensajes'
};

// APP
function App(){
  var us=useState(function(){try{var s=localStorage.getItem('gf_u');return s?JSON.parse(s):null;}catch(e){return null;}});
  var user=us[0],setUser=us[1];
  var ps=useState(null);var page=ps[0],setPage=ps[1];
  useEffect(function(){if(user&&!page)setPage(user.role==='admin'?'adash':'cdash');},[user]);
  if(!user)return h(Login,{setUser:setUser});
  function renderPage(){
    if(user.role==='admin'){
      if(page==='adash')return h(AdminDash,{setPage:setPage});
      if(page==='aclients')return h(AdminClients,null);
      if(page==='abillin')return h(AdminBilling,null);
      if(page==='aiibb')return h(AdminIIBB,null);
      if(page==='apay')return h(AdminPay,null);
      if(page==='amsgs')return h(AdminMsgs,null);
      if(page==='cal')return h(Calendario,null);
    } else {
      if(page==='cdash')return h(ClientDash,{user:user});
      if(page==='cbill')return h(ClientBill,{user:user});
      if(page==='ciibb')return h(ClientIIBB,{user:user});
      if(page==='cpay')return h(ClientPay,{user:user});
      if(page==='calerts')return h(ClientAlerts,{user:user});
      if(page==='cmsgs')return h(ClientMsgs,{user:user});
      if(page==='cal')return h(Calendario,null);
    }
    return h('div',{className:'page'},'Pagina no encontrada');
  }
  return h('div',{className:'shell'},
    h(Sidebar,{user:user,page:page,setPage:setPage,setUser:setUser}),
    h('div',{className:'main'},
      h('header',{className:'topbar'},
        h('h1',{className:'page-heading'},PAGE_TITLES[page]||'Gestion Fiscal'),
        h('span',{className:'tb-badge'},user.role==='admin'?'Administrador':'Categoria '+(user.fiscal?user.fiscal.cat:''))
      ),
      renderPage()
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
